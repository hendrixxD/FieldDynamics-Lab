    <path d="M 22 84 C 36 84, 62 76, 78 52" fill="none" stroke="url(#fullGreen)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 38 106 Q 44 76, 60 56" fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60 56 C 58 40, 74 34, 82 32 C 84 46, 74 54, 60 56 Z" fill="url(#fullGreen)"/>
    <path d="M 52 70 C 44 64, 42 54, 48 48 C 54 50, 56 60, 52 70 Z" fill="#86efac"/>
    <circle cx="38" cy="104" r="5" fill="#fbbf24"/>
