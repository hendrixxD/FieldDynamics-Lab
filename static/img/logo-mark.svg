<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e20"/>
      <stop offset="50%" stop-color="#1b4d27"/>
      <stop offset="100%" stop-color="#24572e"/>
    </linearGradient>
    <linearGradient id="fdGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fdGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="fdOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="fdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#071b0e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fdBg)" stroke="#327542" stroke-width="2.5"/>

  <!-- NASA Earth Observation Orbital Scan Arc -->
  <path d="M 22 96 C 24 50, 60 26, 104 26" fill="none" stroke="url(#fdOrbit)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Orbiting Satellite Pulse / Sensor Node -->
  <circle cx="98" cy="28" r="5.5" fill="#38bdf8" filter="url(#fdGlow)"/>
  <circle cx="98" cy="28" r="2.5" fill="#ffffff"/>

  <!-- Field Rotation Furrow 1 (Soil & Cereal Grain Gold) -->
  <path d="M 22 104 C 42 104, 76 94, 96 66" fill="none" stroke="url(#fdGold)" stroke-width="7" stroke-linecap="round"/>

  <!-- Field Rotation Furrow 2 (Legume & Biomass Canopy Green) -->
  <path d="M 22 84 C 36 84, 62 76, 78 52" fill="none" stroke="url(#fdGreen)" stroke-width="6" stroke-linecap="round"/>

  <!-- Botanical Sprout Stem -->
  <path d="M 38 106 Q 44 76, 60 56" fill="none" stroke="#86efac" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Primary Leaf -->
  <path d="M 60 56 C 58 40, 74 34, 82 32 C 84 46, 74 54, 60 56 Z" fill="url(#fdGreen)" filter="url(#fdGlow)"/>

  <!-- Secondary Leaf -->
  <path d="M 52 70 C 44 64, 42 54, 48 48 C 54 50, 56 60, 52 70 Z" fill="#86efac"/>

  <!-- Seed Root Node -->
  <circle cx="38" cy="104" r="4.5" fill="#fbbf24"/>
</svg>
