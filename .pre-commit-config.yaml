repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: tracked-files
        name: Tracked files
        entry: bash .github/scripts/check-tracked-files.sh
        language: system
        pass_filenames: false
        always_run: true
