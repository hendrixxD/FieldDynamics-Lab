repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [model, api]
        pass_filenames: false
        # The hook runs in its own environment, so api/ needs its typed libraries installed here.
        # Keep these versions equal to requirements.txt.
        additional_dependencies: [fastapi==0.162.0, pydantic==2.14.2]
  - repo: local
    hooks:
      - id: tracked-files
        name: Tracked files
        entry: bash .github/scripts/check-tracked-files.sh
        language: system
        pass_filenames: false
        always_run: true
