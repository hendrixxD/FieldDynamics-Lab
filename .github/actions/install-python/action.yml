name: Install Python dependencies
description: Installs requirements-dev.txt, verifying every hash and running no build scripts.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt
    # Wheels only, because a source package runs setup.py on install, with the job's environment.
    # Short network limits make a stalled download fail in about a minute.
    - shell: bash
      run: |
        pip install --require-hashes --only-binary :all: --timeout 20 --retries 2 \
          -r requirements-dev.txt
