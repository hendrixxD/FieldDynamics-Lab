name: PR

on:
  pull_request:
    # edited reruns the check when the description is fixed, which CI's default types would miss.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  format:
    name: PR format
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-pr.sh
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
