name: CI

on:
  pull_request:
  # Direct pushes are blocked by rulesets, but a push to these still has to pass before deploying.
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a time limit, so a hung step fails in minutes instead of GitHub's 6 hours.
jobs:
  # Runs first and installs nothing, so a hostile dependency is stopped before it can execute.
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/security_scan.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  ruff:
    name: Ruff
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: ruff check .
      - run: ruff format --check .
  mypy:
    name: mypy
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      # Warn only during the hackathon sprint, so type errors never block a merge.
      - run: mypy model api
        continue-on-error: true
  pytest:
    name: pytest
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: pytest
  dependencies:
    name: Dependency versions
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      # Warn only during the hackathon sprint, so a stale lock never blocks a merge.
      - run: bash .github/scripts/check-dependencies.sh
        continue-on-error: true
  tracked-files:
    name: Tracked files
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed to catch files committed and later deleted.
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/check-tracked-files.sh
  # Cancels the rest of the run as soon as any job fails, so a failure surfaces at once. It runs
  # no repository code or packages, which is why it alone can hold the write permission it needs.
  stop-on-failure:
    name: Stop on failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - run: |
          while true; do
            states=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name != "Stop on failure") | .conclusion // "running"')
            if grep -qE '^(failure|timed_out)$' <<<"$states"; then
              echo "::error::A job failed, so the rest of this run was cancelled."
              # Fork PRs get a read-only token, so cancelling can fail. The failure still shows.
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
              exit 1
            fi
            if ! grep -q '^running$' <<<"$states"; then
              exit 0
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ github.token }}
