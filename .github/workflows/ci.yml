name: CI

on:
  pull_request:
  # Direct pushes are blocked by rulesets, but a push to these still has to pass before deploying.
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything else is blocked, so a compromised package cannot send the environment anywhere.
  ALLOWED_ENDPOINTS: >-
    api.github.com:443
    github.com:443
    release-assets.githubusercontent.com:443
    objects.githubusercontent.com:443
    results-receiver.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    pipelines.actions.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    pypi.org:443
    files.pythonhosted.org:443
    api.osv.dev:443

jobs:
  # Runs first and installs nothing, so a hostile dependency is stopped before it can execute.
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/security_scan.py --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  ruff:
    name: Ruff
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    name: mypy
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: mypy model api

  pytest:
    name: pytest
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: pytest

  dependencies:
    name: Dependency versions
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - run: bash .github/scripts/check-dependencies.sh

  tracked-files:
    name: Tracked files
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.ALLOWED_ENDPOINTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed to catch files committed and later deleted.
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/check-tracked-files.sh
